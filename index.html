
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseFlow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <h1>PulseFlow</h1>
            <span id="session-status">Not measuring</span>
        </header>

        <section class="measurement">
            <h2>Live Breathing Rate</h2>

            <div class="rate">
                <span id="breathing-rate">--</span>
                <span class="unit">breaths/min</span>
            </div>

            <div class="breathing-circle">
                <span>●</span>
            </div>

            <p id="measurement-message">
                Waiting for measurement
            </p>
        </section>

        <section class="details">
            <div class="detail-card">
                <h3>Signal Quality</h3>
                <p id="signal-quality">Unavailable</p>
            </div>

            <div class="detail-card">
                <h3>Camera</h3>
                <p id="camera-status">Not selected</p>
            </div>
        </section>

        <section class="controls">
            <button id="start-button" disabled>Start</button>
            <button id="stop-button" disabled>Stop</button>
        </section>

        <footer>
            Powered by SmartSpectra
        </footer>
    </main>
</body>
</html>
